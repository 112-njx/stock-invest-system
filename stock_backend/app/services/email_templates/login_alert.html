<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>异常登录提醒</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f5;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f5f5f5; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="background-color: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
          <tr>
            <td style="padding: 40px 40px 20px; text-align: center;">
              <h1 style="margin: 0; color: #e63946; font-size: 24px;">⚠️ 异常登录提醒</h1>
            </td>
          </tr>
          <tr>
            <td style="padding: 0 40px 20px;">
              <p style="margin: 0 0 16px; color: #333; font-size: 16px; line-height: 1.6;">
                您好，{{ username }}：
              </p>
              <p style="margin: 0 0 16px; color: #333; font-size: 16px; line-height: 1.6;">
                我们检测到您的账户存在异常登录活动：
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding: 0 40px 20px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px;">
                <tr>
                  <td style="padding: 16px;">
                    <p style="margin: 0 0 8px; color: #333; font-size: 14px;">
                      <strong>详情：</strong>{{ alert_detail }}
                    </p>
                    <p style="margin: 0 0 8px; color: #333; font-size: 14px;">
                      <strong>时间：</strong>{{ alert_time }}
                    </p>
                    <p style="margin: 0; color: #333; font-size: 14px;">
                      <strong>IP 地址：</strong>{{ ip_address }}
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding: 10px 40px 30px;">
              <p style="margin: 0 0 12px; color: #333; font-size: 15px; line-height: 1.6;">
                <strong>如果这不是您本人操作，请立即采取以下措施：</strong>
              </p>
              <ol style="margin: 0; padding-left: 20px; color: #333; font-size: 14px; line-height: 1.8;">
                <li>修改您的登录密码</li>
                <li>检查账户授权设备</li>
                <li>开启更安全的密码策略</li>
              </ol>
            </td>
          </tr>
          <tr>
            <td style="padding: 20px 40px 30px;">
              <p style="margin: 0; color: #999; font-size: 13px;">
                此邮件由系统自动发送，如有疑问请联系管理员。
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding: 20px 40px; border-top: 1px solid #eee; text-align: center;">
              <p style="margin: 0; color: #999; font-size: 12px;">
                © 2026 stock-agent-聂久翔 | 量化研究辅助工具
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

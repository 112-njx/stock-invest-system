[project]
name = "stock-backend"
version = "0.1.0"
description = "量化回测软件后端（FastAPI + Celery + Redis + PostgreSQL）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "python-json-logger>=2.0",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
]
# 阶段三（AI/LangChain Agent）时解锁：
# ai = ["langchain>=0.3", "langchain-community>=0.3", "langchain-openai>=0.2", "langgraph>=0.2", "chromadb>=0.5"]
# 行情数据源（DataProvider 默认实现 EastMoney，依赖 akshare）：
# data = ["akshare>=1.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI 惯用 `Depends`/`Query` 放参数默认值（路由层）
ignore = ["E501", "B008"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# CI/CD：lint → test（依赖 PostgreSQL/Redis service 容器）→ build 镜像 → 手动部署
# 部署为 workflow_dispatch 手动触发；需配置 secrets（DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY）后启用。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_invest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d stock_invest"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/stock_invest
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
    defaults:
      run:
        working-directory: stock_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Migrate database
        run: alembic upgrade head
      - name: Seed fixed indices
        run: python scripts/seed_fixed_indices.py
      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: stock_backend/Dockerfile
          push: false
          tags: stock-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: stock_frontend
          file: stock_frontend/Dockerfile
          push: false
          tags: stock-frontend:ci

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        run: |
          echo "部署占位：配置 secrets（DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY）后，在此填充 ssh + docker compose up 步骤"

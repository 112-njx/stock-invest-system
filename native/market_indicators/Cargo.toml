[package]
name = "market-indicators"
version = "0.1.0"
edition = "2021"

[lib]
name = "market_indicators"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.27.2", features = ["extension-module", "abi3-py312"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

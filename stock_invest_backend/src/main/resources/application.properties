spring.application.name=stock_invest_backend
server.port=8081

# ??????? eastmoney / mock
market.data.provider=eastmoney
market.data.eastmoney.base-url=https://push2.eastmoney.com
market.data.eastmoney.quote-path=/api/qt/ulist.np/get
market.data.eastmoney.fields=f12,f13,f14,f2,f3,f4,f5,f6,f15,f16,f17,f18,f124
market.data.eastmoney.timeout-millis=5000

backtest.engine.base-url=http://localhost:8080
backtest.engine.ma-path=/api/backtest/ma
backtest.engine.timeout-millis=5000

# ?????????????
#enabled???????????months?????????defaultSymbols????????cron ???????????
market.history.ingestion.enabled=true
market.history.ingestion.months=3
market.history.ingestion.default-symbols=sh600519,sz000001
market.history.ingestion.cron=0 15 16 * * MON-FRI

# ???MySQL????? enabled?????????url/username/password?JDBC?????
#mysql??? root mysql??:123456
market.history.mysql.enabled=true
market.history.mysql.url=jdbc:mysql://localhost:3306/invest_stock_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
market.history.mysql.username=root
market.history.mysql.password=123456

# Python research service (AkShare ingest worker)
python.research.service.command-base=D:/stock_python/python.exe
python.research.service.working-dir=D:/stock-invest-system/python-research-service
python.research.service.timeout-seconds=300
python.research.service.single-script=scripts/ingest_single.py
python.research.service.health-script=scripts/health_check.py

# LOF test
lof.premium.default-symbols=sz161129,sz161130
lof.premium.symbol-source=db
lof.premium.symbol-refresh-seconds=120
lof.premium.symbol-db-query-limit=2000
lof.premium.fetch-batch-size=100

#lof alert set
lof.premium.event-version=1.0
lof.premium.event-publish-enabled=true
lof.premium.bridge-enabled=false
lof.premium.alert-threshold-up=0.03
lof.premium.alert-threshold-down=-0.03
lof.premium.alert-cooldown-seconds=300
lof.premium.cache-ttl-seconds=5
lof.premium.retry-max-attempts=3
lof.premium.retry-base-delay-ms=200
lof.premium.rate-limit-permits-per-second=5
lof.premium.fields=f12,f13,f14,f2,f18,f124,f257,f258,f339,f340
lof.premium.iopv-field-codes=f340,f258,f257
lof.premium.prev-nav-field-codes=f339,f18

# AI provider: deepseek (default)
ai.provider=deepseek
ai.analysis.timeout-seconds=30
ai.deepseek.base-url=https://api.deepseek.com
ai.deepseek.api-key=xxxxxxxxxx
ai.deepseek.model=deepseek-chat
ai.deepseek.timeout-millis=1000000
ai.deepseek.max-tokens=4096

# redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# datasource (MyBatis-Plus)
spring.datasource.url=jdbc:mysql://localhost:3306/invest_stock_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# 生产全栈一键编排：postgres / redis / api / worker / beat / nginx / prometheus / grafana
#
# 用法：
#   cp .env.docker.example .env.docker && docker compose --env-file ../.env.docker -f deploy/docker-compose.yml up -d --build
#   访问 http://127.0.0.1:8080 （前端 + /api 反代），Grafana http://127.0.0.1:3000
#
# 说明：
#   - db/redis 仅容器内网互联，不映射宿主端口（避免与本机原生 PostgreSQL/Redis 冲突）；
#   - 宿主端口按需映射，默认仅绑定 127.0.0.1（对外发布改 .env.docker 为 0.0.0.0 或 80/443）；
#   - 与根目录 docker-compose.yml（前端单独部署，对接宿主机后端）定位不同，可并存。
#   - 启动入口 docker-entrypoint.sh：等待 DB → Alembic 迁移 → 固定指数种子（均幂等）。
name: stock-invest

# 后端服务（api / worker / beat / migrate）公共环境变量锚点。
# 定义在 services 之前：migrate 服务在 api 之前引用它，YAML 锚点必须先定义后使用。
x-backend-env: &backend_env
  APP_ENV: ${APP_ENV:-prod}
  DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-123456}@db:5432/stock_invest
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MEMORY_DIR: /app/data/memory
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production-0123456789abcdef}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # G05（P1-1）备份：默认落 backenddata 卷内。生产建议改为独立磁盘：
  # 在 .env.docker 设 BACKUP_DIR=/backup 并给 api/worker 加 `- /mnt/backup:/backup` 绑定挂载。
  BACKUP_DIR: ${BACKUP_DIR:-/app/data/backups}
  PG_ARCHIVE_DIR: /wal-archive  # 与 db 的 archive_command 目录一致（只读挂载，供归档状态监控）
  RCLONE_REMOTE: ${RCLONE_REMOTE:-}  # 对象存储远端；为空=模拟模式（不真同步）
  # RCLONE_CONFIG: ${RCLONE_CONFIG:-}  # 或改用 RCLONE_CONFIG_* / AWS_* 环境变量传凭据（勿写死在此文件）

services:
  wal-init:
    # G05：WAL 归档卷由 Docker 以 root 创建，postgres(uid 999) 写不进去 → archive_command 会持续失败。
    # 用一次性 sidecar 先把目录属主改成 postgres，db 再启动。
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /wal-archive && chown -R 999:999 /wal-archive"]
    volumes:
      - pgwal:/wal-archive
    restart: "no"
    networks: [backend]

  db:
    # G04（P1-12a）：使用内置 pgvector 扩展的镜像（替代 postgres:16-alpine）
    image: pgvector/pgvector:pg16
    # G05（P1-1）：开启 WAL 归档以支持 PITR。archive_timeout=300 保证低写入库也有稳定的
    # 恢复点粒度（否则要等 WAL 段写满 16MB 才切换，PITR 可回溯窗口可能长达数小时）。
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - wal_level=replica
      - -c
      - archive_timeout=300
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: stock_invest
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgwal:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_invest"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      wal-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    # G05（P1-1）：AOF（每秒 fsync）+ RDB 快照（60s 内 1000 次写）双持久化。
    # 注意 --save 会整体替换默认的 3 个快照点，只保留这一个（按 P1-1 规格）。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [backend]

  migrate:
    # G10（P1-2a）：迁移/种子**单点**执行。
    # 为什么不能把 RUN_MIGRATIONS 放在 api 上：多实例扩容（`--scale api=3`）会让 3 个副本
    # 并发执行 alembic upgrade + 种子 + presync，撞 pg_type 唯一约束并重复触发 presync
    # （dev 栈踩过，见 docs/Agent_main_v0.1/deploy_fixed.md 问题三）。故独立成一次性服务，
    # api/worker/beat 等它成功退出后再启动。
    # 顺带修复：本文件此前**没有任何服务设置 RUN_MIGRATIONS**，api/worker/beat 全部走
    # wait_for_migrations.py 等待，无人执行迁移 —— 全新库无法自举。
    build: { context: .., dockerfile: stock_backend/Dockerfile }
    command: ["sh", "-c", "echo '[migrate] migrations + seed done'"]
    environment:
      <<: *backend_env
      RUN_MIGRATIONS: "1"
    volumes:
      - backenddata:/app/data
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"
    networks: [backend]

  api:
    build: { context: .., dockerfile: stock_backend/Dockerfile }
    environment: *backend_env
    volumes:
      - backenddata:/app/data
      - pgwal:/wal-archive:ro  # G05：只读挂载 WAL 归档卷，/metrics 可读归档文件数
    depends_on:
      migrate: { condition: service_completed_successfully }  # G10：等迁移单点完成
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # G10（P1-2a）多实例扩容：docker compose up -d --scale api=3
    # 本服务不映射宿主端口（仅 nginx 发布），可安全扩容；nginx 经 upstream api_upstream
    # least_conn 分发，WS 消息由 Redis pub/sub 广播，无需 sticky session。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    networks: [backend]

  # ---- G12（P1-2c）按队列拆分 worker：每个队列独立扩缩容，互不阻塞 ----
  # 为什么拆分：合成一个 worker 时，`--pool=solo` 下任何长任务（回测 / 导出 / 备份）
  # 都会把 15s 的实时轮询堵在队列里；拆开后 sync 队列的延迟不受 backtest/ai 影响。
  # 扩容：`docker compose up -d --scale worker-sync=2 --scale worker-backtest=2 --scale worker-ai=2`
  # （三个服务都不映射宿主端口、无 container_name，可安全多实例）
  # 任务分发：Celery 从 Redis 队列取任务（竞争消费），N 个实例自动分摊，无需额外配置。
  worker-sync:
    build: { context: .., dockerfile: stock_backend/Dockerfile }
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "-Q", "sync,backup", "--pool=solo", "--concurrency=1", "-n", "sync@%h"]
    environment: *backend_env
    volumes:
      - backenddata:/app/data
      - pgwal:/wal-archive:ro  # G05：备份任务检查 WAL 归档状态
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: unless-stopped
    networks: [backend]

  worker-backtest:
    build: { context: .., dockerfile: stock_backend/Dockerfile }
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "-Q", "backtest", "--pool=solo", "--concurrency=1", "-n", "backtest@%h"]
    environment: *backend_env
    volumes:
      - backenddata:/app/data
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: unless-stopped
    networks: [backend]

  worker-ai:
    build: { context: .., dockerfile: stock_backend/Dockerfile }
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "-Q", "ai", "--pool=solo", "--concurrency=1", "-n", "ai@%h"]
    environment: *backend_env
    volumes:
      - backenddata:/app/data
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { disable: true }
    restart: unless-stopped
    networks: [backend]

  beat:
    build: { context: .., dockerfile: stock_backend/Dockerfile }
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat"]
    environment: *backend_env
    volumes:
      - backenddata:/app/data
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # celery 无 HTTP 服务，禁用镜像默认 HTTP healthcheck
    healthcheck: { disable: true }
    restart: unless-stopped
    networks: [backend]

  nginx:
    build: { context: ../stock_frontend }
    # 生产级配置覆盖前端镜像默认模板（限流 / 安全头 / TLS 可配）
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # TLS 证书：启用 HTTPS 时挂载证书到此路径，并取消 nginx.conf 中 443 server 块注释
      # - /path/to/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # - /path/to/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    environment:
      # G10：后端上游改由 deploy/nginx/nginx.conf 内的 upstream api_upstream 定义，
      # 本变量在该模板中已不再引用（前端镜像自带默认模板仍在用，见 dev / 根 compose）
      SSL_REDIRECT: ${SSL_REDIRECT:-false}
    # 等 api 健康就绪再启动 nginx，避免启动期全接口 502（api 已配 /health healthcheck）
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-127.0.0.1:8080}:80"
      - "${NGINX_HTTPS_PORT:-127.0.0.1:8443}:443"
    restart: unless-stopped
    networks: [backend]

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    depends_on: [api]
    ports:
      - "${PROMETHEUS_PORT:-127.0.0.1:9090}:9090"
    restart: unless-stopped
    networks: [backend]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]
    ports:
      - "${GRAFANA_PORT:-127.0.0.1:3000}:3000"
    restart: unless-stopped
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  backenddata:
  pgwal:  # G05：WAL 归档卷（db 写入 /wal-archive，api/worker 只读挂载做归档状态监控）
  promdata:
  grafanadata:

networks:
  backend:
    driver: bridge

# Data directories are relative to this working directory. Use tabs below.
work_dir = /opt/stockdb
pidfile = /tmp/lgdb.pid
server:
	port: 7899
	ip: 0.0.0.0
	readonly: yes
replication:
	binlog: no
logger:
	level: warn
	output: /dev/stdout
leveldb:
	cache_size: 256
	write_buffer_size: 16
	block_size: 32
	compaction_speed: 1000
	compression: yes

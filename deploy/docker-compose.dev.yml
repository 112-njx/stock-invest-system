# 开发阶段容器编排（区别于 deploy/docker-compose.yml 生产版）：
#  - 后端源码 bind mount 热挂载 + uvicorn --reload：改代码免重建镜像，不产生容器文件残留；
#  - 前端构建式：node 自动 npm run build 生成 dist → nginx 托管并反代 /api（免手动构建，改前端需重建 frontend 镜像）；
#  - 去除监控（prometheus/grafana）等生产组件，栈更轻；
#  - 使用前先跑一键清理：bash deploy/cleanup_dev.sh（或直接 bash deploy/start_dev.sh 一键清理+启动）。
#
# 用法：
#   cp .env.docker.example .env.docker   （首次）
#   bash deploy/cleanup_dev.sh           （一键清理残留，可选 -f 连数据卷清空）
#   docker compose --env-file .env.docker -f deploy/docker-compose.dev.yml up -d --build
#   bash deploy/start_dev.sh             （或一键：清理 + 构建 + 启动）
#
# 访问：
#   后端 API   http://127.0.0.1:8000   （uvicorn --reload，改源码自动热重载）
#   前端页面   http://127.0.0.1:8081   （nginx 托管构建产物，/api 反代到 api）
# 说明：
#   - 生产版 db/redis 仅内网，本版同样不映射宿主端口（避免与本机 PostgreSQL/Redis 冲突）；
#     如需用 DBeaver 等直连调试，取消下方 db/redis 的 ports 注释。
#   - 与生产版共用 stock_backend/Dockerfile（已内置国内 PyPI 镜像，pip 不再超时）。
name: stock-invest-dev

# 后端三服务（api/worker/beat）公共环境变量锚点；仅 api 额外置 RUN_MIGRATIONS=1 单点执行迁移/种子/presync
x-backend-env: &backend_env
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-123456}@db:5432/stock_invest
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MEMORY_DIR: /app/data/memory
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production-0123456789abcdef}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8081}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # G05（P1-1）备份：产物落 /app/data/backups（backenddata/宿主 stock_backend/data 卷内，
  # 与后端同卷便于 /metrics 读 status.json）。生产建议改为独立磁盘并同步挂载该路径。
  BACKUP_DIR: ${BACKUP_DIR:-/app/data/backups}
  PG_ARCHIVE_DIR: /wal-archive  # 与 db 的 archive_command 目录一致（只读挂载，供归档状态监控）
  RCLONE_REMOTE: ${RCLONE_REMOTE:-}  # 对象存储远端；为空=模拟模式（不真同步）

services:
  wal-init:
    # G05：WAL 归档卷由 Docker 以 root 创建，postgres(uid 999) 写不进去 → archive_command 会持续失败。
    # 用一次性 sidecar 先把目录属主改成 postgres，db 再启动。
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /wal-archive && chown -R 999:999 /wal-archive"]
    volumes:
      - pgwal:/wal-archive
    restart: "no"
    networks: [backend]

  db:
    # G04（P1-12a）：使用内置 pgvector 扩展的镜像（替代 postgres:16-alpine）
    image: pgvector/pgvector:pg16
    # G05（P1-1）：开启 WAL 归档以支持 PITR。archive_timeout=300 保证低写入库也有稳定的
    # 恢复点粒度（否则要等 WAL 段写满 16MB 才切换，PITR 可回溯窗口可能长达数小时）。
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - wal_level=replica
      - -c
      - archive_timeout=300
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: stock_invest
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgwal:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_invest"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      wal-init:
        condition: service_completed_successfully
    # G04：默认映射到宿主 5433，供本地 pytest / DBeaver 直连（本机原生 5432 无 pgvector 扩展）。
    # 若本机 5433 被占用，用 DEV_DB_PORT 覆盖，如 DEV_DB_PORT=127.0.0.1:5434。
    ports:
      - "${DEV_DB_PORT:-127.0.0.1:5433}:5432"
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    # G05（P1-1）：AOF（每秒 fsync）+ RDB 快照（60s 内 1000 次写）双持久化。
    # 注意 --save 会整体替换默认的 3 个快照点，只保留这一个（按 P1-1 规格）。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # 开发调试可选：直连容器内 Redis（避免与本机 stock-redis 6379 冲突）
    # ports: ["127.0.0.1:6380:6379"]
    restart: unless-stopped
    networks: [backend]

  api:
    build:
      context: ..
      dockerfile: stock_backend/Dockerfile
    # 开发热重载：改源码免重建镜像
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # 仅 api 单点执行 alembic 迁移 + 固定指数种子 + presync，避免三容器并发迁移撞 pg_type 唯一约束、presync 重复触发
    environment:
      <<: *backend_env
      RUN_MIGRATIONS: "1"
    volumes:
      # 热挂载后端源码（数据/memory 等随宿主 stock_backend/data 落盘，与本地开发一致）
      - ../stock_backend:/app
      # G05：只读挂载 WAL 归档卷，/metrics 可读归档文件数
      - pgwal:/wal-archive:ro
    ports:
      - "${DEV_API_PORT:-127.0.0.1:8000}:8000"
    depends_on: [db, redis]
    # dev 为 --reload 多进程：healthcheck 用较长 interval/retries 容忍 reload 子进程重启，避免误判 unhealthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks: [backend]

  worker:
    build:
      context: ..
      dockerfile: stock_backend/Dockerfile
    # G05：新增 backup 队列（备份任务独立队列；--pool=solo 下仍串行，扩实例时可按队列隔离）
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "-Q", "backtest,sync,ai,backup", "--pool=solo", "--concurrency=1", "-n", "worker@%h"]
    environment: *backend_env
    volumes:
      - ../stock_backend:/app
      - pgwal:/wal-archive:ro  # G05：备份任务检查 WAL 归档状态
    depends_on: [db, redis]
    healthcheck: { disable: true }
    restart: unless-stopped
    networks: [backend]

  beat:
    build:
      context: ..
      dockerfile: stock_backend/Dockerfile
    # --schedule 放容器内 /tmp（非挂载）：避免本地 Python3.13+ 的 SQLite dbm 与容器 3.12 dbm 格式冲突导致 "db type could not be determined"
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend_env
    volumes:
      - ../stock_backend:/app
    depends_on: [db, redis]
    healthcheck: { disable: true }
    restart: unless-stopped
    networks: [backend]

  frontend:
    # 开发阶段构建式：node 自动 npm run build 生成 dist（免手动构建），nginx 托管 + 反代 /api。
    # 改前端代码后需重建镜像：docker compose --env-file .env.docker -f deploy/docker-compose.dev.yml up -d --build frontend
    build:
      context: ../stock_frontend
      dockerfile: Dockerfile
    image: stock-frontend:dev
    environment:
      NGINX_PROXY_PASS: http://api:8000
    # 等 api 健康就绪再启动 nginx，避免启动期全接口 502（nginx 先于 api 监听的竞态）
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DEV_NGINX_PORT:-127.0.0.1:8081}:80"
    restart: unless-stopped
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  pgwal:  # G05：WAL 归档卷（db 写入 /wal-archive，api/worker 只读挂载做归档状态监控）

networks:
  backend:
    driver: bridge

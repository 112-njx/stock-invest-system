# 告警规则（Grafana 面板 + Prometheus 告警）
groups:
  - name: stock-invest
    rules:
      - alert: ApiErrorRateHigh
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (path)
            / sum(rate(http_requests_total[5m])) by (path) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "接口 5xx 错误率超过 5%"
          description: "{{ $labels.path }} 错误率 {{ $value | humanizePercentage }}，持续 5 分钟。"

      - alert: BacktestQueueBacklog
        expr: celery_queue_depth{queue="backtest"} > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "回测队列积压"
          description: "backtest 队列积压 {{ $value }} 个任务，持续 5 分钟，可能 worker 未启动或执行缓慢。"

      - alert: MarketDataStale
        expr: market_data_freshness_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "行情快照过期"
          description: "snapshot_realtime 最新快照已超过 {{ $value | humanizeDuration }} 未更新，检查行情同步任务。"

      - alert: LLMErrorRateHigh
        expr: |
          sum(rate(llm_calls_total{status="failed"}[10m]))
            / clamp_min(sum(rate(llm_calls_total[10m])), 1) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM 调用失败率过高"
          description: "10 分钟内 LLM 失败率 {{ $value | humanizePercentage }}，检查 DeepSeek Key / 熔断状态。"

      # ---- G05（P1-1）备份与灾难恢复 ----
      - alert: BackupStale
        # -1 表示从未成功备份；26h（BACKUP_MAX_AGE_HOURS）覆盖每日 02:00 一次 + 抖动余量
        expr: backup_last_success_age_seconds < 0 or backup_last_success_age_seconds > 93600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "备份缺失或过期"
          description: "最近一次成功备份距今 {{ $value | humanizeDuration }}（-1 为从未成功）。检查 worker 的 backup 队列与 task_logs 中 backup 记录。"

      - alert: BackupDiskSpaceLow
        expr: backup_disk_free_ratio >= 0 and backup_disk_free_ratio < 0.15
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "备份盘剩余空间不足"
          description: "备份目录所在文件系统剩余 {{ $value | humanizePercentage }}，低于 15% 阈值，备份可能写坏。清理过期备份或扩容。"

      # ---- G25（P1-4b）回测监控与异常策略 ----
      - alert: BacktestFailureRateHigh
        expr: |
          sum(rate(backtest_failures_total[10m]))
            / clamp_min(sum(rate(backtest_runs_total[10m])), 0.1) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "回测失败率过高"
          description: "10 分钟内回测失败率 {{ $value | humanizePercentage }}，按 reason 维度排查（timeout/memory/cpu/runtime/no_data）。"

      - alert: BacktestAbnormalStrategy
        expr: increase(backtest_abnormal_strategy_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "出现异常策略（连续失败/超时/内存超限）"
          description: "近 1 小时有 {{ $value }} 个策略连续失败达阈值（reason={{ $labels.reason }}），检查策略代码与资源预算。"

      - alert: WalArchiveStalled
        # -1 为未配置/不可读（本地开发常见），只在确实读到归档目录且长期无新文件时告警
        expr: backup_wal_archive_files == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "WAL 归档目录为空"
          description: "归档目录持续 1 小时无 WAL 文件，PITR 不可用。检查 db 容器 archive_mode/archive_command 与 pg_stat_archiver.failed_count。"

# 生产级 Nginx 模板（deploy/docker-compose.yml 的 nginx 服务使用）
# 覆盖前端镜像默认 default.conf.template；静态资源来自前端 build 产物。
# 基于前端版本增强：API 分级限流 / 安全响应头 / TLS 可选。
#
# 说明：镜像官方 entrypoint 用 envsubst 只替换「已定义环境变量」，nginx 内置变量
#       （$binary_remote_addr / $remote_addr 等）不会被误替换；${NGINX_PROXY_PASS} 由 compose 注入。
#
# ===== HTTPS 启用步骤 =====
#   1. 将 TLS 证书挂载到 /etc/nginx/certs/（fullchain.pem + privkey.pem）
#   2. 取消下方「443 server 块」注释
#   3. 在 .env.docker 中设置 SSL_REDIRECT=true + COOKIE_SECURE=true
#   4. 重建 nginx 容器：docker compose up -d --build nginx
# ==========================

# ---- API 分级限流（按客户端 IP）----
# 行情等常规接口宽松；AI 接口（SSE/策略生成）严格
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;

# ---- G29 日志脱敏：token 参数一律打码，避免 Nginx/代理日志泄露 ----
# 前端已不再把 token 放 URL（WS 走 HttpOnly Cookie 握手鉴权），此处兜底兼容
# 历史客户端 / 第三方脚本 / 手工 curl 仍可能带 token 的情况。
map $request_uri $safe_request_uri {
    "~^(.*[?&]token=)[^&]+(.*)$"  "$1***$2";
    default                       $request_uri;
}

log_format masked '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $safe_request_uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# ===== 80 server 块（HTTP）=====
server {
    listen 80;
    server_name _;

    # G29：使用脱敏日志格式（token 参数打码）
    access_log /var/log/nginx/access.log masked;

    # ---- HTTPS 重定向（SSL_REDIRECT 由 compose 注入，默认 false）----
    # 生产启用 HTTPS 后设 SSL_REDIRECT=true，80 端口全部 301 → 443
    # 注意：nginx 的 if 左值必须是变量，不能直接写 if (${SSL_REDIRECT} = "true")
    #      （envsubst 后变成 if (false = "true") 会报 invalid condition），
    #      故先用 set 把环境变量值注入为 nginx 变量再比较。
    set $ssl_redirect "${SSL_REDIRECT}";
    if ($ssl_redirect = "true") {
        return 301 https://$host$request_uri;
    }

    # gzip 静态压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # ---- G01 安全响应头 ----
    # HSTS：通知浏览器后续访问强制 HTTPS（max-age=1年 + includeSubDomains）
    #   注意：仅在 HTTPS 实际启用后有实质效果；HTTP 下浏览器忽略此头。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP：限制资源来源，阻止 XSS 注入 inline script / 外部脚本
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss:; font-src 'self' data:" always;
    # 防止点击劫持（DENY 禁止任何来源嵌入 iframe）
    add_header X-Frame-Options "DENY" always;
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    # 控制 Referer 头泄露
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 带 hash 的构建产物：长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 重复安全头（nginx location 级 add_header 会覆盖 server 级）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss:; font-src 'self' data:" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # AI 流式对话（SSE）：精确匹配，更严限流 + 关闭缓冲透传
    location = /api/v1/chat {
        limit_req zone=ai_limit burst=5 nodelay;
        proxy_pass ${NGINX_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # API 反向代理（后端 FastAPI，内网 api:8000）
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass ${NGINX_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # AI 流式对话（SSE）关闭缓冲透传
        proxy_buffering off;
    }

    # SPA 路由回退（/market、/ai 等前端路由）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        # 重复安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss:; font-src 'self' data:" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}


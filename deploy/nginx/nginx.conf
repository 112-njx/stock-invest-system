# 生产级 Nginx 模板（deploy/docker-compose.yml 的 nginx 服务使用）
# 覆盖前端镜像默认 default.conf.template；静态资源来自前端 build 产物。
# 基于前端版本增强：API 分级限流 / 安全响应头 / TLS 可选。
#
# 说明：镜像官方 entrypoint 用 envsubst 只替换「已定义环境变量」，nginx 内置变量
#       （$binary_remote_addr / $remote_addr 等）不会被误替换；${NGINX_PROXY_PASS} 由 compose 注入。
#       TLS 启用：挂载证书到 /etc/nginx/certs/ 并取消下方 443 server 块注释。

# ---- API 分级限流（按客户端 IP）----
# 行情等常规接口宽松；AI 接口（SSE/策略生成）严格
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # gzip 静态压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 带 hash 的构建产物：长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # AI 流式对话（SSE）：精确匹配，更严限流 + 关闭缓冲透传
    location = /api/v1/chat {
        limit_req zone=ai_limit burst=5 nodelay;
        proxy_pass ${NGINX_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # API 反向代理（后端 FastAPI，内网 api:8000）
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass ${NGINX_PROXY_PASS};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # AI 流式对话（SSE）关闭缓冲透传
        proxy_buffering off;
    }

    # SPA 路由回退（/market、/ai 等前端路由）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

